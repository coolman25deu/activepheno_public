[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "activepheno"
version = "0.1.0"
description = "Reproducible multimodal live-cell phenotypic profiling"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2,<4", "pyarrow>=15", "PyYAML>=6"]

[project.optional-dependencies]
plots = ["matplotlib>=3.8,<4"]
dev = ["pytest>=8"]
chemistry = ["rdkit>=2024.3", "json5>=0.9"]
baselines = ["scikit-learn>=1.5,<2", "scipy>=1.12", "threadpoolctl>=3", "joblib>=1.3"]
images = ["Pillow>=10", "torch>=2.2", "torchvision>=0.17", "transformers>=4.56,<5", "huggingface-hub>=0.30"]
molformer = ["torch>=2.2", "transformers>=4.56,<5", "huggingface-hub>=0.30", "rdkit>=2024.3"]

[project.scripts]
activepheno-prepare = "activepheno.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
